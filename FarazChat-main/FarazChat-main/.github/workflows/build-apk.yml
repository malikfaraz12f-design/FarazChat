name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: FarazChat-main/FarazChat-main
        run: npm install

      - name: Build web app
        working-directory: FarazChat-main/FarazChat-main
        run: npm run build

      - name: Sync Capacitor
        working-directory: FarazChat-main/FarazChat-main
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: FarazChat-main/FarazChat-main/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: FarazChat-main/FarazChat-main/android/app/build/outputs/apk/debug/app-debug.apk
